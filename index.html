<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
</head>

<body>
  <main class="card-container">
    <section class="card-section">
      <div class="card-content">
        <h1>Stay updated!</h1>
        <p>Join 60,000+ product managers receiving monthly updates on:</p>
        <ul>
          <li><img src="assets/images/icon-list.svg" alt="check-icon" class="check-icon">Product discovery and building
            what matters</li>
          <li><img src="assets/images/icon-list.svg" alt="check-icon" class="check-icon">Measuring to ensure updates are
            a success</li>
          <li><img src="assets/images/icon-list.svg" alt="check-icon" class="check-icon"> And much more!
          </li>
        </ul>

        <form id="subscribe-form">
          <label for="email" id="email-label">Email address</label>
          <span class="email-error"></span>
          <input type="email" id="email-input" placeholder="email@company.com">
          <button type="submit" id="submit-btn">Subscribe to monthly newsletter</button>
        </form>

      </div>
      <div class="images">
        <img src="assets/images/illustration-sign-up-desktop.svg" alt="illustration-sign-up-desktop"
          class="desktop-image">

        <img src="assets/images/illustration-sign-up-mobile.svg" alt="illustration-sign-up-mobile" class="mobile-image">


      </div>

    </section>
  </main>


  <div class="footer-container">
    <div class="footer-contant">
      Challenge by <a href="https://mlab.co.za/" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://samukelo-khathi-portfolio-codetribe.vercel.app/" target="_blank">Samukelo Khathi</a>.
    </div>
  </div>
</body>

<script src="main.js"></script>

</html>
